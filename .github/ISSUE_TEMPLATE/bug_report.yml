name: Bug report
description: Report a reproducible, public-safe product or documentation problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Use synthetic data and remove all personal
        Garmin information. Read SUPPORT.md before continuing.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe one reproducible problem and the expected result.
    validations:
      required: true
  - type: input
    id: guide
    attributes:
      label: Guide or command
      description: Name the guide section or sanitized command involved.
      placeholder: "docs/product_quick_start.md — Run the synthetic workflow"
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system
      description: Include the operating system and version.
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell
      description: Include the shell and version.
      placeholder: "bash 5.2"
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "Python 3.11.9"
    validations:
      required: true
  - type: input
    id: package_version
    attributes:
      label: Package version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Use placeholders for private paths and values. Do not upload files.
      render: shell
    validations:
      required: true
  - type: input
    id: exit_code
    attributes:
      label: Exit code
      placeholder: "0, 2, or 3"
    validations:
      required: true
  - type: dropdown
    id: synthetic_reproduction
    attributes:
      label: Does the tracked synthetic fixture reproduce the problem?
      options:
        - "Yes"
        - "No"
        - "Not tested"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Public-safe logs
      description: Include only the minimal sanitized error code or message.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not attached or pasted a real Garmin Export, full output, or real Activity rows.
          required: true
        - label: I have removed IDs, stable keys, filenames, private paths, and hashes.
          required: true
        - label: I have removed exact dates, timestamps, routes, locations, and memo text.
          required: true
        - label: This report does not publicly disclose a suspected vulnerability or sensitive security detail.
          required: true
