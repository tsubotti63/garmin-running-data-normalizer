# C3 of v2.3.0, a disposable branch (not for main): its only job runs the PowerShell lines of the Windows check of
# 2.3.0rc3 (.github/c3/), whose head that chooses the folder of the share is replaced by a folder of the runner.
# Started by hand only (gh workflow run ci.yml --ref c3-windows-lines-ci).
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c3-windows-lines:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Run the lines of the Windows check (share head replaced)
        shell: powershell
        run: .\.github\c3\run.ps1
