<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic monthly activity distance chart</title>
  <desc id="desc">Synthetic and fictional bar chart showing monthly total activity distance: 2030-01: 37.0 kilometres across 4 activities, 2030-02: 47.0 kilometres across 4 activities.</desc>
  <style>
    .bg { fill: #f7fafc; }
    .panel { fill: #ffffff; stroke: #8fa3b8; stroke-width: 2; }
    .accent { fill: #0f766e; }
    .accent2 { fill: #075985; }
    .ink { fill: #102a43; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #486581; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .inverse { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .line { stroke: #0f766e; stroke-width: 4; fill: none; }
  </style>
  <rect class="bg" width="1200" height="620" rx="24"/>
  <text x="40" y="54" class="ink" font-size="28" font-weight="700">Monthly activity distance</text>
  <rect x="930" y="28" width="230" height="38" rx="19" class="accent"/>
  <text x="1045" y="53" text-anchor="middle" class="inverse" font-size="16" font-weight="700">Synthetic / fictional data</text>
  <text x="40" y="90" class="muted" font-size="18">Tracked fictional analysis example • all activity types</text>
  <line x1="110" y1="470.0" x2="1070" y2="470.0" stroke="#d9e2ec" stroke-width="1"/>
  <text x="92" y="476.0" text-anchor="end" class="muted" font-size="15">0</text>
  <line x1="110" y1="404.0" x2="1070" y2="404.0" stroke="#d9e2ec" stroke-width="1"/>
  <text x="92" y="410.0" text-anchor="end" class="muted" font-size="15">10</text>
  <line x1="110" y1="338.0" x2="1070" y2="338.0" stroke="#d9e2ec" stroke-width="1"/>
  <text x="92" y="344.0" text-anchor="end" class="muted" font-size="15">20</text>
  <line x1="110" y1="272.0" x2="1070" y2="272.0" stroke="#d9e2ec" stroke-width="1"/>
  <text x="92" y="278.0" text-anchor="end" class="muted" font-size="15">30</text>
  <line x1="110" y1="206.0" x2="1070" y2="206.0" stroke="#d9e2ec" stroke-width="1"/>
  <text x="92" y="212.0" text-anchor="end" class="muted" font-size="15">40</text>
  <line x1="110" y1="140.0" x2="1070" y2="140.0" stroke="#d9e2ec" stroke-width="1"/>
  <text x="92" y="146.0" text-anchor="end" class="muted" font-size="15">50</text>
  <text x="35" y="305.0" transform="rotate(-90 35 305.0)" text-anchor="middle" class="ink" font-size="17">Distance (km)</text>
  <rect x="240.0" y="225.8" width="220.0" height="244.2" rx="10" class="accent2"/>
  <text x="350.0" y="211.8" text-anchor="middle" class="ink" font-size="20" font-weight="700">37.0 km</text>
  <text x="350.0" y="504" text-anchor="middle" class="ink" font-size="18">2030-01</text>
  <text x="350.0" y="528" text-anchor="middle" class="muted" font-size="15">4 activities</text>
  <rect x="720.0" y="159.8" width="220.0" height="310.2" rx="10" class="accent2"/>
  <text x="830.0" y="145.8" text-anchor="middle" class="ink" font-size="20" font-weight="700">47.0 km</text>
  <text x="830.0" y="504" text-anchor="middle" class="ink" font-size="18">2030-02</text>
  <text x="830.0" y="528" text-anchor="middle" class="muted" font-size="15">4 activities</text>
  <text x="110" y="580" class="muted" font-size="15">Source: examples/analysis/monthly_weekly_training_trends/input_sample.csv</text>
</svg>
