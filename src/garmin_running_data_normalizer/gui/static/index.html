<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title"></title>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.mjs"></script>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="app.title"></h1>
    <p id="product-version" class="version"></p>
  </header>
  <p class="notice" data-i18n="app.development"></p>
  <p class="notice" data-i18n="app.privacy"></p>

  <section aria-labelledby="input-heading">
    <h2 id="input-heading" data-i18n="input.heading"></h2>
    <p class="help" data-i18n="input.help"></p>
    <label for="input-path" data-i18n="input.label"></label>
    <div class="path-row">
      <input id="input-path" type="text" autocomplete="off" spellcheck="false">
      <button type="button" id="input-browse" data-i18n="browse.button" disabled></button>
    </div>
    <div class="button-row">
      <button type="button" id="check-button" data-i18n="check.button" disabled></button>
    </div>
    <div id="check-result" class="messages" role="status" aria-live="polite"></div>
  </section>

  <section id="browser" class="browser" aria-labelledby="browser-heading" hidden>
    <h2 id="browser-heading" data-i18n="browser.heading" tabindex="-1"></h2>
    <p id="browser-path" class="path"></p>
    <p class="help" data-i18n="browser.hint"></p>
    <div class="button-row">
      <button type="button" id="browser-up" data-i18n="browser.up"></button>
      <button type="button" id="browser-choose" data-i18n="browser.choose"></button>
      <button type="button" id="browser-close" data-i18n="browser.close"></button>
    </div>
    <p id="browser-message" role="status" aria-live="polite"></p>
    <ul id="browser-list" class="folder-list"></ul>
  </section>

  <section aria-labelledby="output-heading">
    <h2 id="output-heading" data-i18n="output.heading"></h2>
    <label for="output-parent" data-i18n="output.parent"></label>
    <div class="path-row">
      <input id="output-parent" type="text" autocomplete="off" spellcheck="false">
      <button type="button" id="output-browse" data-i18n="browse.button" disabled></button>
    </div>
    <label for="output-name" data-i18n="output.name"></label>
    <input id="output-name" type="text" autocomplete="off" spellcheck="false" aria-describedby="output-name-help">
    <p id="output-name-help" class="help" data-i18n="output.name_help"></p>
    <label for="timezone" data-i18n="timezone.label"></label>
    <input id="timezone" type="text" list="timezone-list" autocomplete="off" spellcheck="false" aria-describedby="timezone-help">
    <datalist id="timezone-list"></datalist>
    <p id="timezone-help" class="help" data-i18n="timezone.help"></p>
    <div class="checkbox-row">
      <input id="safe-pack" type="checkbox" aria-describedby="safe-pack-help">
      <label for="safe-pack" data-i18n="pack.label"></label>
    </div>
    <p id="safe-pack-help" class="help" data-i18n="pack.help"></p>
  </section>

  <section aria-labelledby="run-heading">
    <h2 id="run-heading" data-i18n="run.heading"></h2>
    <div class="button-row">
      <button type="button" id="start-button" class="primary" data-i18n="run.start" disabled></button>
      <button type="button" id="cancel-button" data-i18n="run.cancel" disabled></button>
    </div>
    <div id="run-status" class="messages" role="status" aria-live="polite"></div>
    <p id="run-elapsed" class="help"></p>
    <h3 id="result-heading" data-i18n="result.heading" hidden></h3>
    <div id="run-result" class="messages" role="status" aria-live="polite"></div>
    <table id="family-table" hidden>
      <caption data-i18n="result.caption"></caption>
      <thead>
        <tr>
          <th scope="col" data-i18n="result.column_data"></th>
          <th scope="col" data-i18n="result.column_status"></th>
          <th scope="col" data-i18n="result.column_records"></th>
          <th scope="col" data-i18n="result.column_warnings"></th>
        </tr>
      </thead>
      <tbody id="family-rows"></tbody>
    </table>
  </section>

  <footer class="controls">
    <label for="language-select" data-i18n="language.label"></label>
    <select id="language-select"></select>
    <button type="button" id="quit-button" data-i18n="quit.button" disabled></button>
    <p id="connection-status" class="status" role="status" aria-live="polite"></p>
  </footer>
</main>
</body>
</html>
