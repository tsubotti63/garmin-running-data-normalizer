<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.title"></title>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.mjs"></script>
</head>
<body>
<div id="connection-problem" class="problem messages" role="alert" hidden></div>
<header class="topbar">
  <div class="title-row">
    <div class="title">
      <h1 data-i18n="app.title"></h1>
      <p class="development" data-i18n="app.development"></p>
    </div>
    <div class="top-tools">
      <div class="switch">
        <input id="hints-toggle" type="checkbox" role="switch" checked>
        <label for="hints-toggle" data-i18n="hints.toggle"></label>
      </div>
      <button type="button" id="help-button" class="help-button" aria-expanded="false" aria-controls="help-panel" data-i18n="help.button"></button>
    </div>
  </div>
  <p id="next-line" class="next-line" aria-live="polite"><span class="next-label" data-i18n="next_line.label"></span> <span id="next-text"></span></p>
</header>
<main class="app">
  <div class="flow">
    <section id="box-export" class="box" aria-labelledby="input-heading">
      <h2 id="input-heading" tabindex="-1"><span class="num" aria-hidden="true"></span><span data-i18n="export.heading"></span><span class="badge"></span></h2>
      <p class="hint" data-i18n="hint.export"></p>
      <p class="summary" hidden></p>
      <div class="button-row">
        <button type="button" id="choose-zip" data-i18n="choose.zip" aria-describedby="choose-help" disabled></button>
        <button type="button" id="choose-folder" data-i18n="choose.folder" aria-describedby="choose-help" disabled></button>
      </div>
      <p id="choose-help" class="help" data-i18n="choose.help"></p>
      <label for="input-path" data-i18n="input.label"></label>
      <input id="input-path" type="text" autocomplete="off" spellcheck="false" aria-describedby="input-help">
      <p id="input-help" class="help" data-i18n="input.help"></p>
      <div class="button-row">
        <button type="button" id="check-button" data-i18n="check.button" disabled></button>
      </div>
      <div id="check-result" class="messages" role="status" aria-live="polite"></div>
      <div id="check-choices" class="button-row" hidden></div>
      <div id="extract-area" hidden>
        <div class="checkbox-row">
          <input id="extract-confirm" type="checkbox" aria-describedby="extract-help">
          <label for="extract-confirm" data-i18n="extract.label"></label>
        </div>
        <p id="extract-help" class="help" data-i18n="extract.help"></p>
      </div>
      <div id="export-error" class="errbox" hidden>
        <h3 id="export-error-heading" tabindex="-1"></h3>
        <div id="export-error-lines" class="messages"></div>
      </div>
    </section>
    <div class="arrow" aria-hidden="true"></div>
    <section id="box-snapshot" class="box" aria-labelledby="snapshot-heading">
      <h2 id="snapshot-heading" tabindex="-1"><span class="num" aria-hidden="true"></span><span data-i18n="snapshot.heading"></span><span class="note" data-i18n="snapshot.subtitle"></span><span class="badge"></span></h2>
      <p class="hint" data-i18n="hint.snapshot"></p>
      <p class="summary" hidden></p>
      <fieldset class="choices">
        <legend id="how-legend" data-i18n="how.legend"></legend>
        <button type="button" id="how-info-button" class="info-button" aria-expanded="false" aria-controls="how-info" aria-labelledby="how-info-button how-legend" data-i18n="info.explain"></button>
        <div id="how-info" class="info-text" hidden>
          <dl>
            <dt data-i18n="how.snapshots"></dt>
            <dd data-i18n="info.how_snapshots"></dd>
            <dt data-i18n="how.single"></dt>
            <dd data-i18n="info.how_single"></dd>
          </dl>
          <p class="info-foot" data-i18n="info.how_foot"></p>
        </div>
        <div class="choice">
          <input type="radio" name="how" id="how-snapshots" value="snapshots" disabled aria-describedby="snapshot-not-yet">
          <label for="how-snapshots" data-i18n="how.snapshots"></label>
        </div>
        <div class="choice">
          <input type="radio" name="how" id="how-single" value="single" checked>
          <label for="how-single" data-i18n="how.single"></label>
        </div>
      </fieldset>
      <p id="snapshot-not-yet" class="note" data-i18n="snapshot.not_yet"></p>
      <div class="unused">
        <p class="label-line" data-i18n="snapshot.list_label"></p>
        <p class="empty" data-i18n="snapshot.empty"></p>
        <label for="store-path" data-i18n="store.label"></label>
        <input id="store-path" type="text" disabled aria-describedby="snapshot-not-yet">
        <div class="button-row">
          <button type="button" id="store-create" data-i18n="store.create" disabled aria-describedby="snapshot-not-yet"></button>
          <button type="button" id="store-open" data-i18n="store.open" disabled aria-describedby="snapshot-not-yet"></button>
        </div>
      </div>
      <div class="decide">
        <button type="button" id="snapshot-decide" data-i18n="decide.button" disabled></button>
      </div>
    </section>
    <div class="arrow" aria-hidden="true"></div>
    <section id="box-output" class="box" aria-labelledby="output-heading">
      <h2 id="output-heading" tabindex="-1"><span class="num" aria-hidden="true"></span><span data-i18n="output.heading"></span><span class="badge"></span></h2>
      <p class="hint" data-i18n="hint.output"></p>
      <p class="summary" hidden></p>
      <label for="output-parent" data-i18n="output.parent"></label>
      <div class="path-row">
        <input id="output-parent" type="text" autocomplete="off" spellcheck="false">
        <button type="button" id="output-browse" data-i18n="browse.button" disabled></button>
      </div>
      <label for="output-name" data-i18n="output.name"></label>
      <input id="output-name" type="text" autocomplete="off" spellcheck="false" aria-describedby="output-name-help">
      <p id="output-name-help" class="help" data-i18n="output.name_help"></p>
      <div class="label-row">
        <label id="timezone-label" for="timezone" data-i18n="timezone.label"></label>
        <button type="button" id="timezone-info-button" class="info-button" aria-expanded="false" aria-controls="timezone-info" aria-labelledby="timezone-info-button timezone-label" data-i18n="info.explain"></button>
      </div>
      <div id="timezone-info" class="info-text" hidden>
        <p data-i18n="info.timezone_text"></p>
        <dl>
          <dt data-i18n="info.care"></dt>
          <dd data-i18n="info.timezone_care1"></dd>
          <dd data-i18n="info.timezone_care2"></dd>
        </dl>
        <p class="info-foot" data-i18n="info.timezone_foot"></p>
      </div>
      <input id="timezone" type="text" list="timezone-list" autocomplete="off" spellcheck="false" aria-describedby="timezone-help">
      <datalist id="timezone-list"></datalist>
      <p id="timezone-help" class="help" data-i18n="timezone.help"></p>
      <div class="checkbox-row">
        <input id="safe-pack" type="checkbox" aria-describedby="safe-pack-help">
        <label id="safe-pack-label" for="safe-pack" data-i18n="pack.label"></label>
      </div>
      <p id="safe-pack-help" class="help" data-i18n="pack.help"></p>
      <button type="button" id="pack-info-button" class="info-button" aria-expanded="false" aria-controls="pack-info" aria-labelledby="pack-info-button safe-pack-label" data-i18n="info.contents"></button>
      <div id="pack-info" class="info-text" hidden>
        <dl>
          <dt data-i18n="info.pack_in_label"></dt>
          <dd data-i18n="info.pack_in"></dd>
          <dt data-i18n="info.pack_out_label"></dt>
          <dd data-i18n="info.pack_out"></dd>
          <dt data-i18n="info.pack_use_label"></dt>
          <dd data-i18n="info.pack_use"></dd>
          <dt data-i18n="info.note"></dt>
          <dd data-i18n="info.pack_note"></dd>
        </dl>
        <p class="info-foot" data-i18n="info.pack_foot"></p>
      </div>
      <p id="pack-file" class="made" hidden></p>
      <div id="output-error" class="errbox" hidden>
        <h3 id="output-error-heading" tabindex="-1"></h3>
        <div id="output-error-lines" class="messages"></div>
      </div>
      <div class="decide">
        <button type="button" id="output-decide" data-i18n="decide.button" disabled></button>
      </div>
    </section>
    <div class="arrow" aria-hidden="true"></div>
    <section id="box-run" class="box" aria-labelledby="run-heading">
      <h2 id="run-heading" tabindex="-1"><span class="num" aria-hidden="true"></span><span data-i18n="run.heading"></span><span class="badge"></span></h2>
      <p class="hint" data-i18n="hint.run"></p>
      <h3 id="result-heading" class="headline" tabindex="-1"></h3>
      <div id="run-exit-row" class="exit-row" hidden>
        <p id="run-exit" class="exit-code"></p>
        <button type="button" id="exit-info-button" class="info-button" aria-expanded="false" aria-controls="exit-info" aria-labelledby="exit-info-button run-exit" data-i18n="info.meaning"></button>
      </div>
      <div id="exit-info" class="info-text" hidden>
        <p data-i18n="info.exit_text"></p>
        <dl>
          <dt data-i18n="info.exit_0_label"></dt>
          <dd data-i18n="info.exit_0"></dd>
          <dt data-i18n="info.exit_3_label"></dt>
          <dd data-i18n="info.exit_3"></dd>
          <dt data-i18n="info.exit_2_label"></dt>
          <dd data-i18n="info.exit_2"></dd>
        </dl>
        <p class="info-foot" data-i18n="info.exit_foot"></p>
      </div>
      <p id="run-sub" class="sub"></p>
      <div id="run-progress" class="progress-lines">
        <p id="fit-progress-label" class="help"></p>
        <progress id="fit-progress" aria-labelledby="fit-progress-label" hidden></progress>
        <p id="run-stalled" class="help"></p>
      </div>
      <p id="run-elapsed" class="help"></p>
      <p id="run-announcer" class="visually-hidden" role="status" aria-live="polite"></p>
      <div class="button-row">
        <button type="button" id="start-button" class="primary big" data-i18n="run.start" disabled></button>
        <button type="button" id="cancel-button" class="big" data-i18n="run.cancel" disabled></button>
      </div>
      <p id="start-reason" class="help"></p>
      <div id="cancel-confirm" class="confirm" hidden>
        <p data-i18n="run.cancel_confirm"></p>
        <div class="button-row">
          <button type="button" id="cancel-yes" data-i18n="run.cancel_yes"></button>
          <button type="button" id="cancel-no" data-i18n="run.cancel_no"></button>
        </div>
      </div>
      <div id="run-status" class="messages" role="status" aria-live="polite"></div>
      <div id="run-result" class="messages"></div>
      <div id="run-error" class="errbox" hidden>
        <h3 id="run-error-heading" tabindex="-1"></h3>
        <div id="run-error-lines" class="messages"></div>
      </div>
      <div id="next-actions" class="next-actions" hidden>
        <h3 data-i18n="next_actions.heading"></h3>
        <div class="button-row">
          <button type="button" id="open-folder-button" class="primary" data-i18n="open.folder" disabled></button>
          <button type="button" id="open-start-here-button" data-i18n="open.start_here" disabled></button>
          <button type="button" id="ai-help-button" data-i18n="next_actions.ai"></button>
        </div>
        <div id="open-result" class="messages" role="status" aria-live="polite"></div>
      </div>
      <div class="tools">
        <h3 class="tools-heading"><button type="button" id="tools-toggle" class="tools-toggle" aria-expanded="false" aria-controls="tools-body" data-i18n="tools.heading"></button></h3>
        <p class="note" data-i18n="tools.summary"></p>
        <button type="button" id="tools-info-button" class="info-button" aria-expanded="false" aria-controls="tools-info" aria-labelledby="tools-info-button tools-toggle" data-i18n="info.explain"></button>
        <div id="tools-info" class="info-text" hidden>
          <dl>
            <dt data-i18n="output_check.heading"></dt>
            <dd data-i18n="info.tools_check"></dd>
            <dt data-i18n="bundle.heading"></dt>
            <dd data-i18n="info.tools_bundle"></dd>
            <dt data-i18n="info.note"></dt>
            <dd data-i18n="info.tools_note"></dd>
          </dl>
          <p class="info-foot" data-i18n="info.tools_foot"></p>
        </div>
        <div id="tools-body" hidden>
          <div class="button-row">
            <button type="button" id="faq-help-button" data-i18n="tools.faq"></button>
          </div>
          <h4 id="bundle-heading" tabindex="-1" data-i18n="bundle.heading"></h4>
          <p class="help" data-i18n="bundle.help"></p>
          <p class="help" data-i18n="bundle.review_help"></p>
          <div class="button-row">
            <button type="button" id="bundle-button" data-i18n="bundle.button" disabled></button>
          </div>
          <div id="bundle-result" class="messages" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </div>

  <section id="browser" class="browser panel" aria-labelledby="browser-heading" hidden>
    <h2 id="browser-heading" tabindex="-1"></h2>
    <p id="browser-path" class="path"></p>
    <p id="browser-hint" class="help"></p>
    <div class="button-row">
      <button type="button" id="browser-up" data-i18n="browser.up"></button>
      <button type="button" id="browser-choose" data-i18n="browser.choose"></button>
      <button type="button" id="browser-close" data-i18n="browser.close"></button>
    </div>
    <p id="browser-message" role="status" aria-live="polite"></p>
    <ul id="browser-list" class="folder-list"></ul>
  </section>

  <div class="legend">
    <span class="legend-title" data-i18n="legend.title"></span>
    <span class="legend-item"><span class="swatch k-current" aria-hidden="true"></span><span data-i18n="legend.current"></span></span>
    <span class="legend-item"><span class="swatch k-done" aria-hidden="true"></span><span data-i18n="legend.done"></span></span>
    <span class="legend-item"><span class="swatch k-warn" aria-hidden="true"></span><span data-i18n="legend.warn"></span></span>
    <span class="legend-item"><span class="swatch k-error" aria-hidden="true"></span><span data-i18n="legend.error"></span></span>
    <span class="legend-item"><span class="swatch k-none" aria-hidden="true"></span><span data-i18n="legend.none"></span></span>
  </div>

  <div class="lower">
    <section id="steps-panel" class="panel" aria-labelledby="steps-heading">
      <h2 id="steps-heading" data-i18n="steps.heading"></h2>
      <p id="steps-caption" class="help"></p>
      <table class="t">
        <thead>
          <tr>
            <th scope="col" data-i18n="steps.column_step"></th>
            <th scope="col" data-i18n="steps.column_state"></th>
            <th scope="col" class="n" data-i18n="steps.column_time"></th>
          </tr>
        </thead>
        <tbody id="steps-rows"></tbody>
        <tfoot>
          <tr>
            <th scope="row" id="steps-total-label"></th>
            <td></td>
            <td id="steps-total" class="n"></td>
          </tr>
        </tfoot>
      </table>
      <div id="output-check-area" hidden>
        <h3 id="output-check-heading" data-i18n="output_check.heading" tabindex="-1"></h3>
        <div id="output-check" class="messages" role="status" aria-live="polite"></div>
      </div>
    </section>
    <section id="results-panel" class="panel" aria-labelledby="results-heading">
      <h2 id="results-heading" data-i18n="result.caption"></h2>
      <p id="results-caption" class="help"></p>
      <table id="family-table" class="t">
        <thead>
          <tr>
            <th scope="col" data-i18n="result.column_data"></th>
            <th scope="col" class="n" data-i18n="result.column_records"></th>
            <th scope="col" data-i18n="result.column_status"></th>
            <th scope="col" class="n" data-i18n="result.column_warnings"></th>
          </tr>
        </thead>
        <tbody id="family-rows"></tbody>
        <tfoot id="family-total" hidden>
          <tr>
            <th scope="row" data-i18n="result.total_label"></th>
            <td></td>
            <td id="family-total-text"></td>
            <td id="family-total-count" class="n"></td>
          </tr>
        </tfoot>
      </table>
    </section>
  </div>
</main>

<aside id="help-panel" class="help-panel" aria-labelledby="help-heading" hidden>
  <div class="help-head">
    <h2 id="help-heading" tabindex="-1" data-i18n="help.heading"></h2>
    <button type="button" id="help-close" data-i18n="help.close"></button>
  </div>
  <nav class="help-nav" aria-labelledby="help-nav-label">
    <span id="help-nav-label" class="visually-hidden" data-i18n="help.nav"></span>
    <button type="button" id="help-nav-steps" data-section="steps" data-i18n="help.steps"></button>
    <button type="button" id="help-nav-faq" data-section="faq" data-i18n="help.faq"></button>
    <button type="button" id="help-nav-words" data-section="words" data-i18n="help.words"></button>
    <button type="button" id="help-nav-ai" data-section="ai" data-i18n="help.ai"></button>
  </nav>
  <div class="help-body">
    <section id="help-steps" class="help-section" aria-labelledby="help-steps-heading">
      <h3 id="help-steps-heading" tabindex="-1" data-i18n="help.steps"></h3>
      <h4 data-i18n="help.get_heading"></h4>
      <ol class="get-steps">
        <li data-i18n="help.get_step1"></li>
        <li data-i18n="help.get_step2"></li>
        <li data-i18n="help.get_step3"></li>
      </ol>
      <p class="note" data-i18n="help.get_note"></p>
      <h4 data-i18n="help.boxes_heading"></h4>
      <p class="lede" data-i18n="help.steps_lede"></p>
      <ol class="walk">
        <li>
          <button type="button" id="walk-export" data-step="export" aria-describedby="walk-export-state walk-export-text" data-i18n="help.step_export"></button>
          <span id="walk-export-state" class="walk-state"></span>
          <p id="walk-export-text" data-i18n="help.step_export_text"></p>
        </li>
        <li>
          <button type="button" id="walk-snapshot" data-step="snapshot" aria-describedby="walk-snapshot-state walk-snapshot-text" data-i18n="help.step_snapshot"></button>
          <span id="walk-snapshot-state" class="walk-state"></span>
          <p id="walk-snapshot-text" data-i18n="help.step_snapshot_text"></p>
        </li>
        <li>
          <button type="button" id="walk-output" data-step="output" aria-describedby="walk-output-state walk-output-text" data-i18n="help.step_output"></button>
          <span id="walk-output-state" class="walk-state"></span>
          <p id="walk-output-text" data-i18n="help.step_output_text"></p>
        </li>
        <li>
          <button type="button" id="walk-run" data-step="run" aria-describedby="walk-run-state walk-run-text" data-i18n="help.step_run"></button>
          <span id="walk-run-state" class="walk-state"></span>
          <p id="walk-run-text" data-i18n="help.step_run_text"></p>
        </li>
        <li>
          <button type="button" id="walk-results" data-step="results" aria-describedby="walk-results-state walk-results-text" data-i18n="help.step_results"></button>
          <span id="walk-results-state" class="walk-state"></span>
          <p id="walk-results-text" data-i18n="help.step_results_text"></p>
        </li>
      </ol>
    </section>
    <section id="help-faq" class="help-section" aria-labelledby="help-faq-heading" hidden>
      <h3 id="help-faq-heading" tabindex="-1" data-i18n="help.faq"></h3>
      <details class="qa"><summary data-i18n="faq.zip_q"></summary><p data-i18n="faq.zip_a"></p></details>
      <details class="qa"><summary data-i18n="faq.exit_q"></summary><p data-i18n="faq.exit_a"></p></details>
      <details class="qa"><summary data-i18n="faq.send_q"></summary><p data-i18n="faq.send_a"></p></details>
      <details class="qa"><summary data-i18n="faq.values_q"></summary><p data-i18n="faq.values_a"></p></details>
      <details class="qa"><summary data-i18n="faq.date_q"></summary><p data-i18n="faq.date_a"></p></details>
      <details class="qa"><summary data-i18n="faq.window_q"></summary><p data-i18n="faq.window_a"></p></details>
    </section>
    <section id="help-words" class="help-section" aria-labelledby="help-words-heading" hidden>
      <h3 id="help-words-heading" tabindex="-1" data-i18n="help.words"></h3>
      <dl class="words">
        <dt data-i18n="words.normalize"></dt>
        <dd data-i18n="words.normalize_text"></dd>
        <dt data-i18n="words.snapshot"></dt>
        <dd data-i18n="words.snapshot_text"></dd>
        <dt data-i18n="words.how"></dt>
        <dd data-i18n="words.how_text"></dd>
        <dt data-i18n="words.exit"></dt>
        <dd data-i18n="words.exit_text"></dd>
        <dt data-i18n="words.output_check"></dt>
        <dd data-i18n="words.output_check_text"></dd>
        <dt data-i18n="words.bundle"></dt>
        <dd data-i18n="words.bundle_text"></dd>
        <dt data-i18n="words.pack"></dt>
        <dd data-i18n="words.pack_text"></dd>
        <dt data-i18n="words.start_here"></dt>
        <dd data-i18n="words.start_here_text"></dd>
      </dl>
    </section>
    <section id="help-ai" class="help-section" aria-labelledby="help-ai-heading" hidden>
      <h3 id="help-ai-heading" tabindex="-1" data-i18n="help.ai_heading"></h3>
      <p class="lede" data-i18n="ai.lede"></p>
      <ol class="ai-steps">
        <li><strong data-i18n="ai.step1_title"></strong><span data-i18n="ai.step1"></span></li>
        <li><strong data-i18n="ai.step2_title"></strong><span data-i18n="ai.step2"></span></li>
        <li><strong data-i18n="ai.step3_title"></strong><span data-i18n="ai.step3"></span></li>
        <li><strong data-i18n="ai.step4_title"></strong><span data-i18n="ai.step4"></span></li>
        <li><strong data-i18n="ai.step5_title"></strong><span data-i18n="ai.step5"></span></li>
      </ol>
      <h4 data-i18n="ai.examples"></h4>
