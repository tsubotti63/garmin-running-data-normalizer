<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="view.title"></title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/view.css">
<script type="module" src="/view.mjs"></script>
</head>
<body class="view-page">
<div id="connection-problem" class="problem messages" role="alert" hidden></div>
<div class="view-app">
<header class="view-top">
  <div class="view-title-row">
    <h1 data-i18n="app.title"></h1>
    <p class="page-note" data-i18n="view.other_tab"></p>
    <button type="button" id="to-normalize" class="small" data-i18n="view.to_normalize"></button>
    <p id="next-line" class="next-line view-next" aria-live="polite"><span id="next-label" class="next-label"></span> <span id="next-text"></span></p>
    <span class="spacer"></span>
    <div class="switch">
      <input id="hints-toggle" type="checkbox" role="switch" disabled>
      <label for="hints-toggle" data-i18n="hints.toggle"></label>
    </div>
    <button type="button" id="help-button" class="help-button" aria-expanded="false" aria-controls="help-panel" data-i18n="help.button"></button>
  </div>
</header>
<main class="view-main">
  <div id="filters" class="filters">
    <div id="output-filter" class="filter output-filter">
      <p class="filter-label"><label for="output-select" data-i18n="view.output.label"></label><span id="output-badge" class="badge-now" data-i18n="badge.current" hidden></span></p>
      <div class="filter-row">
        <select id="output-select" disabled></select>
        <button type="button" id="open-latest" class="primary small" hidden></button>
        <button type="button" id="choose-output" class="small with-icon" data-i18n="target.other" disabled></button>
      </div>
    </div>
    <div class="filter">
      <p id="period-label" class="filter-label" data-i18n="view.period.label"></p>
      <div class="filter-row">
        <div id="period-choices" class="segmented" role="group" aria-labelledby="period-label">
          <button type="button" data-period="all" aria-pressed="false" data-i18n="view.period.all" disabled></button>
          <button type="button" data-period="10y" aria-pressed="false" data-i18n="view.period.years10" disabled></button>
          <button type="button" data-period="5y" aria-pressed="false" data-i18n="view.period.years5" disabled></button>
          <button type="button" data-period="3y" aria-pressed="false" data-i18n="view.period.years3" disabled></button>
          <button type="button" data-period="1y" aria-pressed="false" data-i18n="view.period.years1" disabled></button>
          <button type="button" data-period="custom" aria-pressed="false" aria-controls="range-row" data-i18n="view.period.custom" disabled></button>
        </div>
        <span class="shift">
          <button type="button" id="period-back" class="icon-button" data-i18n-label="view.period.back" disabled><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button type="button" id="period-next" class="icon-button" data-i18n-label="view.period.next" disabled><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </span>
      </div>
      <div id="range-row" class="range-row" hidden>
        <label for="range-from" data-i18n="view.range.from"></label>
        <input id="range-from" type="date" aria-describedby="range-problem">
        <label for="range-to" data-i18n="view.range.to"></label>
        <input id="range-to" type="date" aria-describedby="range-problem">
        <p id="range-problem" class="range-problem" role="status" aria-live="polite"></p>
      </div>
    </div>
    <div class="filter">
      <p id="grain-label" class="filter-label" data-i18n="view.grain.label"></p>
      <div id="grain-choices" class="segmented" role="group" aria-labelledby="grain-label">
        <button type="button" data-grain="auto" aria-pressed="false" disabled><span data-i18n="view.grain.auto"></span><span id="grain-auto-now" class="auto-now"></span></button>
        <button type="button" data-grain="day" aria-pressed="false" data-i18n="view.grain.day" disabled></button>
        <button type="button" data-grain="week" aria-pressed="false" data-i18n="view.grain.week" disabled></button>
        <button type="button" data-grain="month" aria-pressed="false" data-i18n="view.grain.month" disabled></button>
        <button type="button" data-grain="year" aria-pressed="false" data-i18n="view.grain.year" disabled></button>
      </div>
    </div>
    <div class="filter types-filter">
      <p id="types-label" class="filter-label" data-i18n="view.types.label"></p>
      <button type="button" id="types-button" class="field-button" aria-expanded="false" aria-controls="types-pop" aria-labelledby="types-label types-summary" disabled><span id="types-summary"></span><svg class="caret" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div id="types-pop" class="pop types-pop" hidden>
        <fieldset>
          <legend data-i18n="view.types.label"></legend>
          <div id="types-list" class="types-list"></div>
        </fieldset>
        <p class="note" data-i18n="view.types.note"></p>
        <div class="button-row">
          <button type="button" id="types-close" class="small" data-i18n="help.close"></button>
        </div>
      </div>
    </div>
  </div>
  <p id="filters-hint" class="hint filters-hint" data-i18n="view.hint.filters" hidden></p>
  <p id="compare-off" class="compare-off" data-i18n="view.compare.off" hidden></p>
  <p id="compare-off-race" class="compare-off" data-i18n="view.compare.off_race" hidden></p>
  <p id="compare-off-calendar" class="compare-off" data-i18n="view.compare.off_calendar" hidden></p>
  <p id="plot-off" class="compare-off" data-i18n="view.plot.off" hidden></p>
  <p id="spread-off" class="compare-off" data-i18n="view.spread.off" hidden></p>
  <div id="view-body" class="view-body">
    <aside id="shelf" class="shelf" aria-labelledby="shelf-heading">
      <section id="layouts" class="layouts" aria-labelledby="layouts-heading">
        <div class="layouts-head">
          <h2 id="layouts-heading" data-i18n="view.layouts.heading"></h2>
          <span class="spacer"></span>
          <button type="button" id="layouts-manage" class="small" aria-expanded="false" aria-controls="layouts-pop" data-i18n="view.layouts.manage" disabled></button>
        </div>
        <div id="layout-cards" class="layout-cards"></div>
        <div class="layouts-actions">
          <button type="button" id="layout-save-as" class="small" aria-expanded="false" aria-controls="layout-save" data-i18n="view.layouts.save_as" disabled></button>
          <button type="button" id="layout-overwrite" class="small" data-i18n="view.layouts.overwrite" hidden></button>
        </div>
        <div id="layout-save" class="layout-save" hidden>
          <label for="layout-name" data-i18n="view.layouts.name_label"></label>
          <div class="layout-save-row">
            <input id="layout-name" type="text" maxlength="60" autocomplete="off" spellcheck="false" aria-describedby="layout-problem">
            <button type="button" id="layout-save-button" class="primary small" data-i18n="view.layouts.save"></button>
            <button type="button" id="layout-save-cancel" class="small" data-i18n="view.layouts.cancel"></button>
          </div>
        </div>
        <p id="layout-problem" class="layout-problem" role="status" aria-live="polite"></p>
        <div id="layouts-pop" class="pop layouts-pop" role="dialog" aria-labelledby="layouts-pop-title" hidden>
          <div class="pop-head"><span id="layouts-pop-title" class="pop-title" data-i18n="view.layouts.manage"></span><button type="button" id="layouts-pop-close" class="small" data-i18n="view.layouts.close"></button></div>
          <div id="layouts-pop-body"></div>
        </div>
      </section>
      <div class="shelf-head">
        <h2 id="shelf-heading" data-i18n="view.shelf.heading"></h2>
        <span id="shelf-count" class="note"></span>
        <button type="button" id="coverage-button" class="info-button" aria-expanded="false" aria-controls="coverage-text" data-i18n="view.shelf.bars"></button>
        <span class="spacer"></span>
        <button type="button" id="shelf-fold" class="icon-button" aria-expanded="true" aria-controls="shelf" data-i18n-label="view.shelf.fold"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div id="coverage-text" class="info-text" hidden>
        <ul class="note-list">
          <li data-i18n="view.shelf.bars_month"></li>
          <li data-i18n="view.shelf.bars_types"></li>
          <li data-i18n="view.shelf.bars_start"></li>
        </ul>
      </div>
      <label for="shelf-search" class="visually-hidden" data-i18n="view.shelf.search_label"></label>
      <input id="shelf-search" class="shelf-search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="view.shelf.search" disabled>
      <p id="shelf-hint" class="hint" hidden></p>
      <div class="shelf-columns" aria-hidden="true"><span></span><span data-i18n="view.shelf.item"></span><span data-i18n="view.shelf.when"></span></div>
      <div id="shelf-groups" class="shelf-groups"></div>
    </aside>
    <div id="shelf-rail" class="rail" hidden>
      <button type="button" id="shelf-open" class="rail-button" aria-expanded="false" aria-controls="shelf" data-i18n-label="view.shelf.open"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="rail-text" data-i18n="view.shelf.rail" aria-hidden="true"></span></button>
      <span id="rail-count" class="rail-count"></span>
      <button type="button" id="rail-layouts" class="rail-button" aria-expanded="false" aria-controls="rail-layouts-pop"><span class="rail-text" data-i18n="view.layouts.rail"></span></button>
      <div id="rail-layouts-pop" class="pop rail-layouts-pop" role="dialog" aria-labelledby="rail-layouts-title" hidden>
        <div class="pop-head"><span id="rail-layouts-title" class="pop-title" data-i18n="view.layouts.heading"></span><button type="button" id="rail-layouts-close" class="small" data-i18n="view.layouts.close"></button></div>
        <div id="rail-layout-cards" class="layout-cards"></div>
      </div>
    </div>
    <section id="stage" class="stage" aria-labelledby="stage-heading">
      <h2 id="stage-heading" class="visually-hidden" data-i18n="view.stage.heading"></h2>
      <div id="full-bar" class="full-bar" hidden>
        <p id="full-text" class="full-text"></p>
        <span class="spacer"></span>
        <button type="button" id="full-back" class="small" data-i18n="view.full.back"></button>
      </div>
      <div id="part-note" class="part-note" hidden>
        <svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M8 1.9l6.5 11.8h-13z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 6.3v3.4M8 11.6v.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <p><strong data-i18n="view.partial.title"></strong> <span id="part-text"></span></p>
      </div>
      <div id="empty-box" class="empty-box">
        <div class="empty-inner">
          <h3 id="empty-heading" tabindex="-1"></h3>
          <p id="empty-text"></p>
          <div id="empty-buttons" class="button-row">
            <button type="button" id="empty-primary" class="primary"></button>
            <button type="button" id="empty-other" class="with-icon" data-i18n="target.other"></button>
          </div>
        </div>
      </div>
      <div id="stop-box" class="errbox view-stop" hidden>
        <h3 id="stop-heading" tabindex="-1"></h3>
        <div id="stop-lines" class="messages"></div>
        <div class="button-row">
          <button type="button" id="stop-normalize" class="primary" data-i18n="view.stop.normalize_again" hidden></button>
          <button type="button" id="stop-other" class="with-icon" data-i18n="target.other"></button>
        </div>
        <p id="stop-code" class="stop-code"></p>
      </div>
      <div id="caveat" class="caveat" hidden>
        <span id="add-wrap" class="add-wrap" hidden>
          <button type="button" id="add-items" class="small with-plus" aria-expanded="false" aria-controls="picker" data-i18n="view.add.button"></button>
          <span id="picker" class="pop picker" hidden>
            <span class="pop-head"><span id="picker-heading" class="pop-title"></span><button type="button" id="picker-close" class="small" data-i18n="help.close"></button></span>
            <span id="picker-full" class="note" data-i18n="view.add.full" hidden></span>
            <span id="picker-groups" class="picker-groups"></span>
          </span>
        </span>
        <p class="caveat-text" data-i18n="view.caveat"></p>
        <p id="loading" class="loading" role="status" aria-live="polite"></p>
        <span class="spacer"></span>
        <span class="other-views">
          <button type="button" id="other-views" class="small" aria-haspopup="menu" aria-expanded="false" aria-controls="other-views-menu"><span data-i18n="view.other.button"></span><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <span id="other-views-menu" class="pop other-menu" role="menu" aria-labelledby="other-views" hidden>
            <button type="button" id="other-plot" role="menuitem" tabindex="-1" data-i18n="view.other.plot"></button>
            <button type="button" id="other-spread" role="menuitem" tabindex="-1" data-i18n="view.other.spread"></button>
          </span>
        </span>
        <button type="button" id="recap-open" class="small" aria-expanded="false" aria-controls="recap-pop" data-i18n="view.recap.button"></button>
        <span class="align-row">
          <input id="marks-shown" type="checkbox">
          <label for="marks-shown" data-i18n="view.marks.show"></label>
        </span>
        <button type="button" id="marks-open" class="small" aria-expanded="false" aria-controls="marks-pop" data-i18n="view.marks.button"></button>
        <span class="align-row">
          <input id="align-scales" type="checkbox">
          <label for="align-scales" data-i18n="view.align"></label>
        </span>
        <button type="button" id="full-enter" class="small full-enter"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="view.full.enter"></span></button>
        <div id="marks-pop" class="pop marks-pop" role="dialog" aria-labelledby="marks-pop-title" hidden>
          <div class="pop-head"><span id="marks-pop-title" class="pop-title"></span><button type="button" id="marks-pop-close" class="small" data-i18n="help.close"></button></div>
          <p id="marks-legend" class="marks-legend"></p>
          <p id="marks-notice" class="marks-notice" role="status" aria-live="polite"></p>
          <div id="marks-list" class="marks-list"></div>
          <div id="marks-form" class="marks-form">
            <p id="mark-form-heading" class="marks-form-heading"></p>
            <label for="mark-day" data-i18n="view.marks.day"></label>
            <span class="marks-days">
              <input id="mark-day" type="date" min="1900-01-01" aria-describedby="mark-problem">
              <span aria-hidden="true" data-i18n="view.marks.until"></span>
              <label for="mark-end" class="visually-hidden" data-i18n="view.marks.end"></label>
              <input id="mark-end" type="date" min="1900-01-01" aria-describedby="mark-end-note mark-problem">
              <span id="mark-end-note" class="note" data-i18n="view.marks.end_note"></span>
            </span>
            <label for="mark-kind" data-i18n="view.marks.kind"></label>
            <select id="mark-kind"></select>
            <label for="mark-name" data-i18n="view.marks.name"></label>
            <span class="marks-name-row">
              <input id="mark-name" type="text" maxlength="60" autocomplete="off" spellcheck="false" aria-describedby="mark-problem">
              <button type="button" id="mark-save" class="primary small" data-i18n="view.marks.add"></button>
              <button type="button" id="mark-cancel" class="small" data-i18n="view.marks.cancel" hidden></button>
            </span>
            <p id="mark-problem" class="layout-problem marks-problem" role="status" aria-live="polite"></p>
          </div>
          <p class="note marks-store" data-i18n="view.marks.store_note"></p>
        </div>
        <div id="recap-pop" class="pop recap-pop" role="dialog" aria-labelledby="recap-pop-title" hidden>
          <div class="pop-head"><span id="recap-pop-title" class="pop-title" tabindex="-1" data-i18n="view.recap.title"></span><button type="button" id="recap-pop-close" class="small" data-i18n="help.close"></button></div>
          <p id="recap-days" class="recap-days"></p>
          <p id="recap-loading" class="loading" role="status" aria-live="polite"></p>
          <div id="recap-stop" class="errbox view-stop" hidden>
            <h4 id="recap-stop-heading" tabindex="-1" data-i18n="view.stop.series_heading"></h4>
            <div id="recap-stop-lines" class="messages"></div>
            <p id="recap-stop-code" class="stop-code"></p>
          </div>
          <div id="recap-body" class="recap-body" tabindex="0" role="region" aria-labelledby="recap-pop-title"></div>
          <p id="recap-difference-note" class="note recap-note" data-i18n="view.recap.note"></p>
          <p class="note recap-note" data-i18n="view.recap.records_note"></p>
          <p id="recap-cut" class="note recap-note"></p>
        </div>
      </div>
      <section id="compare" class="compare" aria-labelledby="compare-title" hidden>
        <div class="compare-bar">
          <div class="compare-line">
            <label for="compare-item" class="visually-hidden" data-i18n="view.compare.item"></label>
            <h3 id="compare-title" class="compare-title"><span id="compare-before"></span><select id="compare-item"></select><span id="compare-middle"></span><span id="compare-bys" class="segmented compare-bys" role="group" aria-labelledby="compare-by-label"><button type="button" data-compare-by="year" aria-pressed="false" data-i18n="view.compare.by.year"></button><button type="button" data-compare-by="race" aria-pressed="false" aria-describedby="compare-race-needed" data-i18n="view.compare.by.race"></button></span><span id="compare-after"></span></h3>
            <span id="compare-by-label" class="visually-hidden" data-i18n="view.compare.by"></span>
            <span id="compare-race-needed" class="note" data-i18n="view.compare.race_needed" hidden></span>
            <span class="compare-field">
              <span id="compare-show-label" data-i18n="view.compare.show"></span>
              <span id="compare-modes" class="segmented" role="group" aria-labelledby="compare-show-label">
                <button type="button" data-compare-mode="rows" aria-pressed="false"><span id="compare-rows-year" data-i18n="view.compare.mode.rows"></span><span id="compare-rows-race" data-i18n="view.compare.mode.rows_race" hidden></span></button>
                <button type="button" data-compare-mode="overlay" aria-pressed="false" data-i18n="view.compare.mode.overlay"></button>
                <button type="button" data-compare-mode="cumulative" aria-pressed="false" data-i18n="view.compare.mode.cumulative"></button>
                <button type="button" data-compare-mode="calendar" aria-pressed="false" data-i18n="view.compare.mode.calendar"></button>
              </span>
            </span>
            <button type="button" id="compare-about" class="info-button" aria-expanded="false" aria-controls="compare-about-text" data-i18n="view.compare.cumulative_about" hidden></button>
            <button type="button" id="compare-calendar-about" class="info-button" aria-expanded="false" aria-controls="compare-calendar-about-text" data-i18n="view.compare.calendar_about" hidden></button>
            <span id="compare-month-field" class="compare-field">
              <label for="compare-month" data-i18n="view.compare.month"></label>
              <select id="compare-month"></select>
            </span>
            <span id="compare-weeks-field" class="compare-field" hidden>
              <label for="compare-weeks" data-i18n="view.compare.weeks"></label>
              <select id="compare-weeks"></select>
            </span>
            <span id="compare-series-field" class="compare-field" hidden>
              <label for="compare-series" data-i18n="view.compare.series"></label>
              <select id="compare-series"></select>
            </span>
            <button type="button" id="compare-table" class="small" aria-pressed="false"><span id="compare-table-chart" data-i18n="view.panel.chart" hidden></span><span id="compare-table-calendar" data-i18n="view.compare.table_calendar" hidden></span><span id="compare-table-table" data-i18n="view.panel.table"></span></button>
            <span class="spacer"></span>
            <button type="button" id="compare-back" class="small" data-i18n="view.panel.unbig"></button>
          </div>
          <div id="compare-about-text" class="info-text compare-about-text" hidden>
            <p data-i18n="view.compare.cumulative_only"></p>
          </div>
          <div id="compare-calendar-about-text" class="info-text compare-about-text" hidden>
            <p data-i18n="view.compare.calendar_only"></p>
          </div>
          <div class="compare-line">
            <span id="compare-years-label" data-i18n="view.compare.years"></span>
            <span id="compare-races-label" data-i18n="view.compare.races" hidden></span>
            <span id="compare-years" class="segmented compare-years" role="group" aria-labelledby="compare-years-label" aria-describedby="compare-up-to"></span>
            <span id="compare-races" class="segmented compare-years compare-races" role="group" aria-labelledby="compare-races-label" aria-describedby="compare-races-up-to" hidden></span>
            <span id="compare-up-to" class="note" data-i18n="view.compare.up_to"></span>
            <span id="compare-races-up-to" class="note" data-i18n="view.compare.races_up_to" hidden></span>
            <p id="compare-loading" class="loading" role="status" aria-live="polite"></p>
          </div>
        </div>
        <div id="compare-stop" class="errbox view-stop" hidden>
          <h4 id="compare-stop-heading" tabindex="-1" data-i18n="view.stop.series_heading"></h4>
          <div id="compare-stop-lines" class="messages"></div>
          <p id="compare-stop-code" class="stop-code"></p>
        </div>
        <div id="compare-stack" class="stack compare-stack">
          <div id="compare-legend" class="calendar-legend" hidden></div>
          <div id="compare-panels" class="panels"></div>
          <div id="compare-axis" class="time-axis" aria-hidden="true"></div>
          <p id="compare-announcer" class="visually-hidden" aria-live="polite"></p>
        </div>
        <p id="compare-note" class="compare-note" data-i18n="view.compare.partial_note" hidden></p>
      </section>
      <section id="plot" class="compare plot-two" aria-labelledby="plot-title" hidden>
        <div class="compare-bar">
          <div class="compare-line">
            <label for="plot-x" class="visually-hidden" data-i18n="view.plot.x"></label>
            <label for="plot-y" class="visually-hidden" data-i18n="view.plot.y"></label>
            <h3 id="plot-title" class="compare-title"><span id="plot-before"></span><select id="plot-x"></select><span id="plot-middle"></span><select id="plot-y"></select><span id="plot-after"></span></h3>
            <button type="button" id="plot-table" class="small" aria-pressed="false"><span id="plot-table-chart" data-i18n="view.panel.chart" hidden></span><span id="plot-table-table" data-i18n="view.panel.table"></span></button>
            <span class="spacer"></span>
            <button type="button" id="plot-back" class="small" data-i18n="view.panel.unbig"></button>
          </div>
          <div class="compare-line">
            <span id="plot-count" class="note"></span>
            <p id="plot-loading" class="loading" role="status" aria-live="polite"></p>
          </div>
        </div>
        <div id="plot-stop" class="errbox view-stop" hidden>
          <h4 id="plot-stop-heading" tabindex="-1" data-i18n="view.stop.series_heading"></h4>
          <div id="plot-stop-lines" class="messages"></div>
          <p id="plot-stop-code" class="stop-code"></p>
        </div>
        <div id="plot-stack" class="stack plot-stack">

        <p id="plot-cut" class="compare-note" hidden></p>
        <p id="plot-caveat" class="compare-note plot-caveat" data-i18n="view.plot.caveat"></p>
      </section>
      <section id="spread" class="compare spread-one" aria-labelledby="spread-title" hidden>
        <div class="compare-bar">
          <div class="compare-line">
            <label for="spread-item" class="visually-hidden" data-i18n="view.spread.item"></label>

            <span class="spacer"></span>
            <button type="button" id="spread-back" class="small" data-i18n="view.panel.unbig"></button>

          <div class="compare-line">
            <span id="spread-count" class="note"></span>
            <p id="spread-loading" class="loading" role="status" aria-live="polite"></p>
          </div>
        </div>
        <div id="spread-stop" class="errbox view-stop" hidden>
          <h4 id="spread-stop-heading" tabindex="-1" data-i18n="view.stop.series_heading"></h4>
          <div id="spread-stop-lines" class="messages"></div>
          <p id="spread-stop-code" class="stop-code"></p>
        </div>
        <div id="spread-stack" class="stack plot-stack">
          <div id="spread-body" class="plot-body"></div>
          <p id="spread-none" class="note plot-none" data-i18n="view.spread.none" hidden></p>
          <p id="spread-announcer" class="visually-hidden" aria-live="polite"></p>
        </div>
        <p id="spread-wide" class="compare-note" hidden></p>
        <p id="spread-faster" class="compare-note" data-i18n="view.spread.faster_left" hidden></p>
      </section>
      <div id="series-stop" class="errbox view-stop" hidden>
        <h3 id="series-stop-heading" tabindex="-1" data-i18n="view.stop.series_heading"></h3>
        <div id="series-stop-lines" class="messages"></div>
        <p id="series-stop-code" class="stop-code"></p>
      </div>
      <div id="stack" class="stack" hidden>
        <div id="panels" class="panels"></div>
        <div id="time-axis" class="time-axis" aria-hidden="true"></div>
        <p id="cross-announcer" class="visually-hidden" aria-live="polite"></p>
        <p id="list-hint" class="visually-hidden" data-i18n="view.list.hint"></p>
        <p id="list-announcer" class="visually-hidden" aria-live="polite"></p>
      </div>
      <div id="overview" class="overview" hidden>
        <p id="overview-label" class="overview-label"></p>
        <div id="overview-plot" class="overview-plot"></div>
      </div>
    </section>
  </div>
</main>

        <input type="radio" name="theme" id="theme-dark" value="dark" disabled>

  <p id="settings-status" class="status" role="status" aria-live="polite"></p>
  <span class="spacer"></span>
  <p id="product-version" class="version"></p>
  <button type="button" id="quit-button" data-i18n="view.quit" aria-expanded="false" aria-controls="quit-confirm" disabled></button>
